services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: workagent-postgres
    environment:
      POSTGRES_USER: workagent
      POSTGRES_PASSWORD: workagent
      POSTGRES_DB: workagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workagent-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workagent -d workagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: workagent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workagent
      MINIO_ROOT_PASSWORD: workagent-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - workagent-minio:/data
    profiles: ["s3"]

volumes:
  workagent-pg:
  workagent-minio:
